services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - wealthfolio_connect_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Ephemeral cache only (latest prices, today's candles): no persistence,
    # eviction handles capacity. Durable history lives in Postgres.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  connect:
    build:
        context: .
        dockerfile: Dockerfile
    image: wealthfolio-connect-self-hosted:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Local-only by default.
    # Change to "8080:8080" only if you intentionally want LAN access.
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"

    environment:
      # Required
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CONNECT_AUTH_PUBLISHABLE_KEY: ${CONNECT_AUTH_PUBLISHABLE_KEY:?Set CONNECT_AUTH_PUBLISHABLE_KEY in .env}
      SELF_HOSTED_USER_EMAIL: ${SELF_HOSTED_USER_EMAIL:?Set SELF_HOSTED_USER_EMAIL in .env}

      # Server
      SERVER_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,tauri://localhost,https://tauri.localhost}
      STATIC_TOKEN_MODE: ${STATIC_TOKEN_MODE:-false}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-3600}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-240}

      # Redis (optional short-lived market data: latest prices, today's candles)
      # Empty keeps Redis caching disabled; durable history always uses Postgres.
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}

      # Futu OpenD
      FUTU_HOST: ${FUTU_HOST:-}
      FUTU_PORT: ${FUTU_PORT:-11111}
      FUTU_CONNECTION_ID: ${FUTU_CONNECTION_ID:-wealthfolio}
      FUTU_TRADE_PASSWORD: ${FUTU_TRADE_PASSWORD:-}

      # Interactive Brokers Gateway / TWS
      IBKR_HOST: ${IBKR_HOST:-}
      IBKR_PORT: ${IBKR_PORT:-4001}
      IBKR_CLIENT_ID: ${IBKR_CLIENT_ID:-1}
      IBKR_ACCOUNT_ID: ${IBKR_ACCOUNT_ID:-}

      # SnapTrade IBKR history importer (read-only; empty credentials disable)
      SNAPTRADE_ENABLED: ${SNAPTRADE_ENABLED:-false}
      SNAPTRADE_AUTH_MODE: ${SNAPTRADE_AUTH_MODE:-auto}
      SNAPTRADE_PACKAGE: ${SNAPTRADE_PACKAGE:-personal}
      SNAPTRADE_CLIENT_ID: ${SNAPTRADE_CLIENT_ID:-}
      SNAPTRADE_CONSUMER_KEY: ${SNAPTRADE_CONSUMER_KEY:-}
      SNAPTRADE_USER_ID: ${SNAPTRADE_USER_ID:-}
      SNAPTRADE_USER_SECRET: ${SNAPTRADE_USER_SECRET:-}
      SNAPTRADE_BASE_URL: ${SNAPTRADE_BASE_URL:-https://api.snaptrade.com}
      SNAPTRADE_ACCOUNT_IDS: ${SNAPTRADE_ACCOUNT_IDS:-}
      SNAPTRADE_HISTORY_START_DATE: ${SNAPTRADE_HISTORY_START_DATE:-01.01.2022}
      SNAPTRADE_SYNC_INTERVAL_MINUTES: ${SNAPTRADE_SYNC_INTERVAL_MINUTES:-240}
      SNAPTRADE_REQUEST_INTERVAL_SECONDS: ${SNAPTRADE_REQUEST_INTERVAL_SECONDS:-60}
      SNAPTRADE_REQUESTS_PER_MINUTE: ${SNAPTRADE_REQUESTS_PER_MINUTE:-0}
      SNAPTRADE_ACCOUNT_REQUESTS_PER_MINUTE: ${SNAPTRADE_ACCOUNT_REQUESTS_PER_MINUTE:-0}
      SNAPTRADE_RATE_LIMIT_SAFETY_PERCENT: ${SNAPTRADE_RATE_LIMIT_SAFETY_PERCENT:-80}
      SNAPTRADE_ACTIVITY_PAGE_SIZE: ${SNAPTRADE_ACTIVITY_PAGE_SIZE:-1000}
      SNAPTRADE_MAX_RETRIES: ${SNAPTRADE_MAX_RETRIES:-5}
      SNAPTRADE_RETRY_BASE_SECONDS: ${SNAPTRADE_RETRY_BASE_SECONDS:-5}
      SNAPTRADE_RETRY_MAX_SECONDS: ${SNAPTRADE_RETRY_MAX_SECONDS:-300}
      SNAPTRADE_INCREMENTAL_OVERLAP_DAYS: ${SNAPTRADE_INCREMENTAL_OVERLAP_DAYS:-7}
      SNAPTRADE_REQUEST_TIMEOUT_SECONDS: ${SNAPTRADE_REQUEST_TIMEOUT_SECONDS:-30}
      SNAPTRADE_ALLOW_MANUAL_REFRESH: ${SNAPTRADE_ALLOW_MANUAL_REFRESH:-false}
      SNAPTRADE_ALLOW_TRANSACTION_SYNC: ${SNAPTRADE_ALLOW_TRANSACTION_SYNC:-false}
      SNAPTRADE_MANUAL_REFRESH_COOLDOWN_HOURS: ${SNAPTRADE_MANUAL_REFRESH_COOLDOWN_HOURS:-24}

      # Binance
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BINANCE_TRADE_SYMBOLS: ${BINANCE_TRADE_SYMBOLS:-}

      # OKX CEX
      OKX_API_KEY: ${OKX_API_KEY:-}
      OKX_API_SECRET: ${OKX_API_SECRET:-}
      OKX_PASSPHRASE: ${OKX_PASSPHRASE:-}

      # OKX Web3 / DEX
      OKX_WEB3_API_KEY: ${OKX_WEB3_API_KEY:-}
      OKX_WEB3_API_SECRET: ${OKX_WEB3_API_SECRET:-}
      OKX_WEB3_PASSPHRASE: ${OKX_WEB3_PASSPHRASE:-}
      DEFI_WALLETS: ${DEFI_WALLETS:-[]}

      # Bitget
      BITGET_API_KEY: ${BITGET_API_KEY:-}
      BITGET_API_SECRET: ${BITGET_API_SECRET:-}
      BITGET_PASSPHRASE: ${BITGET_PASSPHRASE:-}

      # Hyperliquid (public wallet address only)
      HYPERLIQUID_WALLET: ${HYPERLIQUID_WALLET:-}

      # TON Center API v3 (native TON + Jetton balances and history)
      TONCENTER_API_KEY: ${TONCENTER_API_KEY:-}
      TON_WALLETS: ${TON_WALLETS:-}

      # Steam CS2 inventory (empty STEAM_ID disables; session stays in env only)
      STEAM_ID: ${STEAM_ID:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      STEAM_SESSION: ${STEAM_SESSION:-}
      STEAM_REFRESH_TOKEN: ${STEAM_REFRESH_TOKEN:-}
      STEAM_PRICE_TTL_MINUTES: ${STEAM_PRICE_TTL_MINUTES:-20}
      STEAM_CURRENCY: ${STEAM_CURRENCY:-1}
      STEAM_HISTORY_BUDGET: ${STEAM_HISTORY_BUDGET:-5}
      STEAM_MIN_ITEM_VALUE_USD: ${STEAM_MIN_ITEM_VALUE_USD:-10}

volumes:
  wealthfolio_connect_postgres:
